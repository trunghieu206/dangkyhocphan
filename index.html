<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaUI | Hệ thống đăng ký học phần</title>
    <style>
        :root {
            --navy: #102a56;
            --blue: #1769aa;
            --blue2: #2785d7;
            --bg: #f3f6fb;
            --ink: #1d2939;
            --muted: #667085;
            --line: #e5eaf2;
            --green: #16845b;
            --red: #c0392b;
            --amber: #a86608
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: var(--ink)
        }

        button,
        input,
        select,
        textarea {
            font: inherit
        }

        button {
            cursor: pointer;
            border: 0;
            border-radius: 9px;
            padding: 10px 14px;
            font-weight: 650
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed
        }

        .primary {
            background: var(--blue);
            color: white
        }

        .primary:hover {
            background: #12568f
        }

        .outline {
            background: white;
            border: 1px solid var(--line);
            color: var(--ink)
        }

        .danger {
            background: #fff0ef;
            color: var(--red)
        }

        .success {
            background: #e7f7ef;
            color: var(--green)
        }

        .muted {
            color: var(--muted)
        }

        .small {
            font-size: 12px
        }

        .app {
            min-height: 100vh
        }

        .topbar {
            height: 72px;
            background: #fff;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: sticky;
            top: 0;
            z-index: 10
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .crest {
            width: 43px;
            height: 43px;
            border-radius: 12px;
            background: linear-gradient(145deg, #1e74ba, #102a56);
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -1px
        }

        .brand strong {
            display: block;
            color: var(--navy);
            font-size: 16px
        }

        .brand span {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: .7px
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #e1efff;
            color: var(--blue);
            display: grid;
            place-items: center;
            font-weight: 800
        }

        .user-meta {
            text-align: right
        }

        .user-meta b {
            font-size: 13px;
            display: block
        }

        .user-meta span {
            font-size: 11px;
            color: var(--muted)
        }

        .layout {
            display: grid;
            grid-template-columns: 248px minmax(0, 1fr);
            min-height: calc(100vh - 72px)
        }

        aside {
            background: #fff;
            border-right: 1px solid var(--line);
            padding: 24px 14px
        }

        .nav-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.2px;
            color: #98a2b3;
            padding: 0 13px;
            margin: 18px 0 8px
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            background: transparent;
            color: #536174;
            text-align: left;
            padding: 12px 13px;
            margin: 3px 0;
            font-weight: 600
        }

        .nav .ico {
            width: 22px;
            text-align: center;
            font-size: 17px
        }

        .nav.active {
            background: #eaf3ff;
            color: var(--blue);
            box-shadow: inset 3px 0 var(--blue)
        }

        .side-note {
            margin: 28px 7px 0;
            padding: 15px;
            border-radius: 12px;
            background: #f5f8fc;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6
        }

        .main {
            padding: 30px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto
        }

        .crumb {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 8px
        }

        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 24px
        }

        .page-head h1 {
            font-size: 26px;
            margin: 0 0 7px;
            color: #162b4d
        }

        .page-head p {
            margin: 0;
            color: var(--muted);
            font-size: 14px
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 9px;
            border-radius: 99px;
            background: #eaf3ff;
            color: #1769aa;
            font-size: 11px;
            font-weight: 750;
            white-space: nowrap
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 22px
        }

        .stat,
        .panel {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 15px;
            box-shadow: 0 3px 12px #203b6010
        }

        .stat {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .stat .label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 9px
        }

        .stat .num {
            font-size: 26px;
            font-weight: 800;
            color: #162b4d
        }

        .stat-icon {
            width: 43px;
            height: 43px;
            border-radius: 12px;
            background: #edf5ff;
            display: grid;
            place-items: center;
            font-size: 20px
        }

        .panel {
            padding: 21px;
            margin-bottom: 20px
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 17px
        }

        .panel h2 {
            font-size: 16px;
            margin: 0;
            color: #1b3154
        }

        .panel-sub {
            font-size: 12px;
            color: var(--muted);
            margin-top: 5px
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px
        }

        .field {
            height: 40px;
            border: 1px solid #d8e0eb;
            border-radius: 9px;
            padding: 0 12px;
            background: white;
            color: var(--ink);
            outline: none;
            min-width: 130px
        }

        .field:focus,
        textarea:focus {
            border-color: #2785d7;
            box-shadow: 0 0 0 3px #2785d71c
        }

        .search {
            flex: 1;
            min-width: 210px
        }

        .table-wrap {
            overflow: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 760px
        }

        th {
            text-align: left;
            background: #f8fafd;
            color: #667085;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .4px;
            padding: 13px 12px;
            border-bottom: 1px solid var(--line)
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid #edf0f5;
            font-size: 13px;
            vertical-align: middle
        }

        tbody tr:hover {
            background: #fbfdff
        }

        tbody tr:last-child td {
            border-bottom: 0
        }

        .code {
            font-weight: 800;
            color: #1769aa;
            font-size: 12px
        }

        .course-name {
            font-weight: 700;
            color: #253858
        }

        .subline {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px
        }

        .status {
            display: inline-block;
            border-radius: 99px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 750
        }

        .status.open {
            background: #e6f7ef;
            color: #16845b
        }

        .status.closed {
            background: #fff1e0;
            color: #a86608
        }

        .status.off {
            background: #f0f1f4;
            color: #667085
        }

        .status.registered {
            background: #eaf3ff;
            color: #1769aa
        }

        .actions {
            display: flex;
            gap: 6px;
            align-items: center
        }

        .icon-btn {
            background: #f4f7fb;
            color: #52627a;
            padding: 7px 9px
        }

        .icon-btn:hover {
            background: #e8f1fc;
            color: var(--blue)
        }

        .btn-sm {
            font-size: 12px;
            padding: 8px 10px
        }

        .empty {
            text-align: center;
            padding: 36px;
            color: var(--muted)
        }

        .empty b {
            display: block;
            color: #344054;
            margin: 8px
        }

        .info-banner {
            display: flex;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 11px;
            background: #edf6ff;
            color: #285d91;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 18px
        }

        .split {
            display: grid;
            grid-template-columns: 1.35fr 1fr;
            gap: 20px
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px
        }

        .course-card {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .course-card-top {
            display: flex;
            justify-content: space-between;
            gap: 10px
        }

        .course-card h3 {
            font-size: 14px;
            margin: 7px 0 4px
        }

        .course-card p {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
            margin: 0
        }

        .card-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 12px;
            color: #52627a
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--line)
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: #0d1b2db8;
            display: grid;
            place-items: center;
            padding: 18px;
            z-index: 30
        }

        .modal {
            background: #fff;
            border-radius: 16px;
            width: min(560px, 100%);
            max-height: 92vh;
            overflow: auto;
            box-shadow: 0 25px 70px #0003
        }

        .modal-head {
            padding: 21px 23px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .modal-head h2 {
            font-size: 18px;
            margin: 0
        }

        .modal-body {
            padding: 22px 23px
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px
        }

        .form-group.full {
            grid-column: 1/-1
        }

        .form-group label {
            font-size: 12px;
            font-weight: 750;
            color: #344054
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            border: 1px solid #d8e0eb;
            border-radius: 9px;
            padding: 10px 11px;
            outline: none;
            background: white
        }

        .form-group textarea {
            min-height: 82px;
            resize: vertical
        }

        .modal-foot {
            padding: 16px 23px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: flex-end;
            gap: 9px
        }

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 50;
            background: #143b62;
            color: white;
            padding: 14px 18px;
            border-radius: 11px;
            box-shadow: 0 10px 30px #102a5633;
            font-size: 13px;
            max-width: 360px;
            animation: up .2s ease
        }

        .toast.error {
            background: #9d3028
        }

        @keyframes up {
            from {
                transform: translateY(8px);
                opacity: 0
            }

            to {
                transform: none;
                opacity: 1
            }
        }

        .login-wrap {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #fff
        }

        .login-art {
            background: linear-gradient(145deg, #0d2854, #1769aa);
            color: white;
            padding: 8vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden
        }

        .login-art:after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            border: 1px solid #ffffff22;
            border-radius: 50%;
            right: -160px;
            bottom: -180px;
            box-shadow: 0 0 0 55px #ffffff08, 0 0 0 110px #ffffff05
        }

        .login-art h1 {
            font-size: clamp(30px, 4vw, 52px);
            line-height: 1.12;
            max-width: 520px;
            margin: 28px 0 15px
        }

        .login-art p {
            line-height: 1.8;
            color: #d7e8fb;
            max-width: 440px
        }

        .login-art .crest {
            background: #fff;
            color: #1769aa
        }

        .login-points {
            margin-top: 25px;
            display: grid;
            gap: 13px;
            font-size: 13px;
            color: #e0edfc
        }

        .login-form-wrap {
            display: grid;
            place-items: center;
            padding: 30px
        }

        .login-form {
            width: min(390px, 100%)
        }

        .login-form h2 {
            font-size: 27px;
            margin: 0 0 8px;
            color: #142b4d
        }

        .login-form>p {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 28px
        }

        .login-form .form-group {
            margin-bottom: 16px
        }

        .login-form .field {
            width: 100%;
            height: 46px
        }

        .login-form button {
            width: 100%;
            height: 46px;
            margin-top: 7px
        }

        .demo-box {
            margin-top: 22px;
            padding: 14px;
            background: #f5f8fc;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.8
        }

        .demo-box b {
            color: #344054
        }

        .mobile-menu {
            display: none
        }

        .footnote {
            font-size: 11px;
            color: #98a2b3;
            text-align: center;
            margin-top: 24px
        }

        @media(max-width:1050px) {
            .layout {
                grid-template-columns: 210px 1fr
            }

            .main {
                padding: 22px
            }

            .stats {
                grid-template-columns: repeat(2, 1fr)
            }

            .split {
                grid-template-columns: 1fr
            }
        }

        @media(max-width:720px) {
            .topbar {
                padding: 0 15px;
                height: 64px
            }

            .brand span {
                display: none
            }

            .brand strong {
                font-size: 13px
            }

            .top-right {
                gap: 8px
            }

            .user-meta {
                display: none
            }

            .layout {
                display: block
            }

            aside {
                display: none;
                position: fixed;
                z-index: 20;
                top: 64px;
                bottom: 0;
                left: 0;
                width: 255px;
                box-shadow: 10px 0 30px #0002
            }

            .layout.menu-open aside {
                display: block
            }

            .main {
                padding: 20px 14px
            }

            .page-head {
                flex-direction: column
            }

            .page-head h1 {
                font-size: 23px
            }

            .stats {
                gap: 9px
            }

            .stat {
                padding: 14px
            }

            .stat .num {
                font-size: 22px
            }

            .stat-icon {
                display: none
            }

            .course-grid {
                grid-template-columns: 1fr
            }

            .panel {
                padding: 15px
            }

            .mobile-menu {
                display: inline-flex
            }

            .form-grid {
                grid-template-columns: 1fr
            }

            .form-group.full {
                grid-column: auto
            }

            .login-wrap {
                grid-template-columns: 1fr
            }

            .login-art {
                display: none
            }

            .login-form-wrap {
                min-height: 100vh;
                padding: 24px
            }

            .toolbar .field {
                flex: 1
            }

            .toolbar .search {
                min-width: 100%
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script>
const seedCourses = [
    { code: "IT6040", name: "Phân tích và thiết kế hệ thống", lt: 3, th: 1, desc: "Phương pháp phân tích yêu cầu, mô hình hóa UML và thiết kế hệ thống thông tin.", status: "Đang hoạt động" },

const seedClasses = [
    { id: "LHP-26001", code: "IT6040", semester: "Học kỳ 1 - 2026/2027", teacher: "ThS. Nguyễn Minh Anh", day: "Thứ 2 · Tiết 1–3", room: "A1-302", max: 60, enrolled: 42, status: "Đang mở" },
    { id: "LHP-26002", code: "IT6040", semester: "Học kỳ 1 - 2026/2027", teacher: "TS. Trần Quốc Việt", day: "Thứ 4 · Tiết 7–9", room: "A1-405", max: 55, enrolled: 55, status: "Đã đủ" },

    { id: "LHP-26005", code: "IT6050", semester: "Học kỳ 1 - 2026/2027", teacher: "ThS. Vũ Hoàng Nam", day: "Thứ 6 · Tiết 7–9", room: "Lab C-03", max: 35, enrolled: 22, status: "Đang mở" },
    { id: "LHP-26006", code: "IT6018", semester: "Học kỳ 1 - 2026/2027", teacher: "ThS. Đỗ Hải Yến", day: "Thứ 4 · Tiết 1–3", room: "B1-305", max: 50, enrolled: 50, status: "Đã đủ" },
    { id: "LHP-26007", code: "IT6062", semester: "Học kỳ 1 - 2026/2027", teacher: "TS. Nguyễn Thành Công", day: "Thứ 3 · Tiết 7–9", room: "A3-301", max: 55, enrolled: 19, status: "Đang mở" },
    { id: "LHP-26008", code: "IT6071", semester: "Học kỳ 1 - 2026/2027", teacher: "TS. Bùi Thanh Tùng", day: "Thứ 6 · Tiết 1–3", room: "A2-402", max: 40, enrolled: 18, status: "Đang mở" }
];
const DEMO = { 
    student: { username: "2024607392", password: "123456", role: "student", name: "Bùi Trung Hiếu", id: "2024607392" }, 
    admin: { username: "admin", password: "admin123", role: "admin", name: "Quản trị viên", id: "ADMIN" } };
let state = { 
    user: null, page: "dashboard", courses: [], classes: [], registrations: [], search: "", filter: "all", toast: null, editing: null, modal: null };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const credits = c => Number(c.lt || 0) + Number(c.th || 0);
const API_BASE = "http://localhost:8080/api/courses";
let apiConnected = false;

async function syncCoursesFromServer() {
    try {
        const res = await fetch(API_BASE);
        if (res.ok) {
            state.courses = await res.json();
            apiConnected = true;
            save();
            render();
        }
    } catch (err) {
        apiConnected = false;

function bindPage() { if (state.page === "catalog") { let i = $("#searchInput"), f = $("#filterSelect"); i.oninput = () => { state.search = i.value; let pos = i.selectionStart; render(); $("#searchInput").focus(); $("#searchInput").setSelectionRange(pos, pos) }; f.onchange = () => { state.filter = f.value; render() }; document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => showClasses(b.dataset.view)); document.querySelectorAll("[data-register]").forEach(b => b.onclick = () => registerClass(b.dataset.register)) } if (state.page === "admincourses") { let i = $("#searchInput"); i.oninput = () => { state.search = i.value; let pos = i.selectionStart; render(); $("#searchInput").focus(); $("#searchInput").setSelectionRange(pos, pos) }; $("#addCourse").onclick = () => openCourseModal(); $("#resetDemo").onclick = () => { if (confirm("Khôi phục danh mục và lớp học phần về dữ liệu mẫu? Các thay đổi demo sẽ bị mất.")) { state.courses = structuredClone(seedCourses); state.classes = structuredClone(seedClasses); state.registrations = []; save(); render(); notify("Đã khôi phục dữ liệu mẫu.") } }; document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openCourseModal(b.dataset.edit)); document.querySelectorAll("[data-delete]").forEach(b => b.onclick = () => deleteCourse(b.dataset.delete)) } document.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => cancelReg(b.dataset.cancel)); document.querySelectorAll("[data-page]").forEach(b => b.onclick = () => { state.page = b.dataset.page; render() }) }
function showClasses(code) {    
    let c = course(code), cl = state.classes.filter(x => x.code === code); let area = $("#classesArea"); area.innerHTML = `<div class="panel" id="classPanel">
    <div class="panel-head">
    <div>
    <h2>${esc(c.name)} · Danh sách lớp học phần</h2>
    <div class="panel-sub">${esc(code)} · ${credits(c)} tín chỉ</div>
    </div>
    <button class="outline btn-sm" id="closeClasses">Đóng</button>
    </div>${cl.length ? classTable(cl) : '<div class="empty">Học phần chưa có lớp được mở.</div>'}</div>`; $("#closeClasses").onclick = () => area.innerHTML = ""; area.scrollIntoView({ behavior: "smooth", block: "start" }); document.querySelectorAll("[data-register]").forEach(b => b.onclick = () => registerClass(b.dataset.register))
    }
    function registerClass(id) { let cl = state.classes.find(c => c.id === id); if (!cl || cl.status !== "Đang mở" || cl.enrolled >= cl.max) { notify("Lớp đã đóng hoặc đã đủ sĩ số.", true); return } if (myRegs().some(r => r.classId === id)) { notify("Bạn đã đăng ký lớp học phần này.", true); return } let c = course(cl.code); if (c.status !== "Đang hoạt động") { notify("Học phần đã ngừng hoạt động.", true); return } if (myRegs().some(r => { let other = state.classes.find(x => x.id === r.classId); return other && other.code === cl.code })) { notify("Bạn đã đăng ký một lớp của học phần này.", true); return } if (!confirm(`Xác nhận đăng ký ${cl.id} – ${c.name}?`)) return; state.registrations.push({ id: "DK-" + Date.now(), student: state.user.id, classId: id, code: cl.code, time: new Date().toISOString(), status: "Đang hiệu lực" }); cl.enrolled++; save(); notify("Đăng ký học phần thành công!"); render() }
    function cancelReg(id) { let r = state.registrations.find(x => x.id === id); if (!r || r.status !== "Đang hiệu lực") return; if (!confirm("Bạn chắc chắn muốn hủy đăng ký lớp này?")) return; r.status = "Đã hủy"; r.cancelTime = new Date().toISOString(); let cl = state.classes.find(c => c.id === r.classId); if (cl) cl.enrolled = Math.max(0, cl.enrolled - 1); save(); render(); notify("Đã hủy đăng ký học phần.") }
    function openCourseModal(code) {    
    let c = code ? state.courses.find(x => x.code === code) : null; $("#modalRoot")?.remove(); let root = document.createElement("div"); root.id = "modalRoot"; root.className = "modal-backdrop"; root.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
    <h2>${c ? "Chỉnh sửa học phần" : "Thêm học phần mới"}</h2>
    <button class="icon-btn" id="xModal">✕</button>
    </div>
    <form id="courseForm">
    <div class="modal-body">
    <div class="form-grid">
    <div class="form-group">
    <label for="cCode">Mã học phần *</label>
    <input id="cCode" required maxlength="20" ${c ? 'readonly' : ''} value="${esc(c?.code || "")}" placeholder="VD: IT6090">
    </div>
    <div class="form-group">
    <label for="cStatus">Trạng thái</label>
    <select id="cStatus">
    <option ${!c || c.status === "Đang hoạt động" ? "selected" : ""}>Đang hoạt động</option>
    <option ${c?.status === "Ngừng hoạt động" ? "selected" : ""}>Ngừng hoạt động</option>
    </select>
    </div>
    <div class="form-group full">
    <label for="cName">Tên học phần *</label>
    <input id="cName" required maxlength="150" value="${esc(c?.name || "")}" placeholder="Nhập tên học phần">
    </div>
    <div class="form-group">
    <label for="cLt">Tín chỉ lý thuyết *</label>
    <input id="cLt" type="number" min="0" max="20" required value="${c?.lt ?? 3}">
    </div>
    <div class="form-group">
    <label for="cTh">Tín chỉ thực hành *</label>
    <input id="cTh" type="number" min="0" max="20" required value="${c?.th ?? 0}">
    </div>
    <div class="form-group full">
    <label for="cDesc">Mô tả</label>
    <textarea id="cDesc" maxlength="500" placeholder="Mô tả ngắn về học phần">${esc(c?.desc || "")}</textarea>
    </div>
    </div>
    <p class="small muted">Mã học phần phải duy nhất. Tổng tín chỉ bằng tín chỉ lý thuyết cộng tín chỉ thực hành.</p>
    </div>
    <div class="modal-foot">
    <button type="button" class="outline" id="cancelModal">Hủy</button>
    <button class="primary" type="submit">Lưu học phần</button>
    </div>
    </form>
    </div>`; document.body.appendChild(root); const close = () => root.remove(); $("#xModal").onclick = close; $("#cancelModal").onclick = close; root.onclick = e => { if (e.target === root) close() }; $("#courseForm").onsubmit = async e => {
        e.preventDefault();
        let item = {
            code: $("#cCode").value.trim().toUpperCase(),
            name: $("#cName").value.trim(),
            lt: Number($("#cLt").value),
            th: Number($("#cTh").value),
            desc: $("#cDesc").value.trim(),
            status: $("#cStatus").value
        };
        if (item.lt + item.th <= 0) { notify("Tổng số tín chỉ phải lớn hơn 0.", true); return; }

        try {
            const url = c ? `${API_BASE}/${encodeURIComponent(c.code)}` : API_BASE;
            const method = c ? "PUT" : "POST";
            const res = await fetch(url, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(item)
            });
            if (res.ok) {
                await syncCoursesFromServer();
                close();
                notify(c ? "Đã cập nhật học phần vào SQL Server!" : "Đã thêm học phần mới vào SQL Server!");
                return;
            } else {
                const errData = await res.json().catch(() => ({}));
                notify(errData.message || "Lỗi khi lưu dữ liệu vào CSDL.", true);
                return;
            }
        } catch (err) {
            // Fallback localStorage nếu chưa bật Backend
            if (!c && state.courses.some(x => x.code.toLowerCase() === item.code.toLowerCase())) {
                notify("Mã học phần đã tồn tại.", true);
                return;
            }
            if (c) { Object.assign(c, item); } else { state.courses.push(item); }
            save(); close(); render();
            notify(c ? "Đã cập nhật học phần (Local)." : "Đã thêm học phần mới (Local).");
        }
    }
}
async function deleteCourse(code) {
    let linked = state.classes.some(c => c.code === code);
    if (linked) {
        notify("Không thể xóa: học phần đang có lớp học phần liên kết. Hãy chuyển trạng thái sang Ngừng hoạt động.", true);
        return;
    }
    if (!confirm(`Xóa học phần ${code}? Thao tác này không thể hoàn tác.`)) return;
    try {
        const res = await fetch(`${API_BASE}/${encodeURIComponent(code)}`, { method: "DELETE" });
        if (res.ok) {
            await syncCoursesFromServer();
            notify("Đã xóa học phần khỏi SQL Server.");
            return;
        } else {
            const errData = await res.json().catch(() => ({}));
            notify(errData.message || "Không thể xóa học phần.", true);
            return;
        }
    } catch (err) {
        state.courses = state.courses.filter(c => c.code !== code);
        save(); render();
        notify("Đã xóa học phần (Local).");
    }
}
load(); render();
    </script>
